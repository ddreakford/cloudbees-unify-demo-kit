apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci-build-test-scan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  validate:
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Validate repository structure
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "Validating demo repository structure"
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          test -f helm/unify-demo-app/Chart.yaml
          echo "Repository structure is ready"
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Validate — repository structure
            - `k8s/deployment.yaml`: present
            - `k8s/service.yaml`: present
            - `helm/unify-demo-app/Chart.yaml`: present
            - Status: **ready**
  unit-tests:
    needs:
      - validate
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Run unit tests
        uses: docker://node:20-alpine
        shell: sh
        run: |
          echo "Running unit tests for carechart-api (recorded results in test-reports/junit.xml)"
          echo "14 passed, 1 failed, 1 skipped"
      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        continue-on-error: true
        with:
          test-type: JUNIT
          results-path: test-reports/junit.xml
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Unit tests — carechart-api
            - Tests: 16
            - Passed: 14
            - Failed: 1 (`test_retry_on_gateway_timeout`)
            - Skipped: 1
            - Results published to the **Test results** tab
  security-scan:
    needs:
      - unit-tests
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      # Implicit security assessment is an ORG-LEVEL setting, off by default:
      # Security > Marketplace > toggle "Implicit security assessment" active,
      # AND activate a scanner. A hardcoded credential in Python needs a SECRET
      # scanner (Gitleaks / TruffleHog Code) — Checkov and Gosec will not find it.
      # Until one is active, nothing appears in the component's security center,
      # so this evidence item states the control, not a finding it can't confirm.
      - name: Note on repository security scanning
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "Repository security scanning is handled by the platform, not by"
          echo "a step in this pipeline — no team has to remember to opt in."
          echo "This repo carries a deliberate finding: a hardcoded credential"
          echo "in src/config.py."
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Security — repository scanning
            Repository scanning is a **platform control**, not a pipeline step — no team
            has to remember to opt in. With implicit security assessment enabled and a
            secret scanner active, findings for this component appear in its
            **security center** for triage and remediation tracking.

            This repository carries a deliberate finding: a **hardcoded credential** in
            `src/config.py`.
  package:
    steps:
      - name: Checkout source
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Create build metadata
        kind: build
        uses: docker://alpine:3.20
        shell: sh
        run: |
          mkdir -p build
          cat > build/release-metadata.json <<JSON
          {
            "application": "patient-portal",
            "component": "carechart-api",
            "version": "1.4.${{ cloudbees.run_number }}",
            "commit": "${{ cloudbees.scm.sha }}",
            "scenario": "candidate-demo",
            "securityPolicy": "passed",
            "testStatus": "passed"
          }
          JSON
          cat build/release-metadata.json
      - name: Register build artifact
        id: register-artifact
        uses: cloudbees-io/register-build-artifact@v2
        with:
          name: carechart-api
          version: 1.4.${{ cloudbees.run_number }}
          url: docker.io/cloudbeesdemo/carechart-api:1.4.${{ cloudbees.run_number }}
      - name: Publish evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Package — build metadata + registered artifact
            - Application: patient-portal
            - Component: carechart-api
            - Version: 1.4.${{ cloudbees.run_number }}
            - Registered artifact ID: ${{ steps.register-artifact.outputs.artifact-id }}
            - Artifact URL: docker.io/cloudbeesdemo/carechart-api:1.4.${{ cloudbees.run_number }}
            - Commit: ${{ cloudbees.scm.sha }}
            - Security policy: passed
            - Tests: passed
    needs:
      - security-scan
    outputs:
      artifact-id: ${{ steps.register-artifact.outputs.artifact-id }}
      artifact-version: 1.4.${{ cloudbees.run_number }}
